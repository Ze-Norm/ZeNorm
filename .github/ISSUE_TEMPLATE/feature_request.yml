name: Feature request
description: Suggest something ZeNorm should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The problem or the workflow, not only the feature.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like ZeNorm to do
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Alternatives you've tried, screenshots, links.
