name: check

on:
  push:
    branches: [main]
  pull_request:
  # The publish workflow runs these jobs on a version tag and publishes only once all pass.
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels its older run; main and tags run every commit.
concurrency:
  group: check-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'latest' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Linux only: a macOS job beside each Linux one used up the Actions minutes too fast. Everything in
# `pnpm check` but e2e, whose flows don't pass on Linux yet: run `pnpm check` locally for them.
# The jobs restore turbo's cache, so a task whose inputs are unchanged since main replays its logs,
# except on a version tag, where the publish workflow's check runs every task.
jobs:
  # tsc and type-aware eslint build each package's program: as long as the tests on 4 vCPUs, so
  # each is split in two package groups of about equal time.
  static:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: typecheck (core, server, db, web, zenorm)
            key: typecheck-1
            run: pnpm exec turbo run typecheck --filter=@zenorm/core --filter=@zenorm/server --filter=@zenorm/db --filter=@zenorm/web --filter=@zenorm/zenorm
          - name: build and typecheck (the rest)
            key: typecheck-2
            run: pnpm exec turbo run build typecheck --filter=!@zenorm/core --filter=!@zenorm/server --filter=!@zenorm/db --filter=!@zenorm/web --filter=!@zenorm/zenorm
          - name: lint (core, server, db, web)
            key: lint-1
            run: pnpm exec turbo run lint --filter=@zenorm/core --filter=@zenorm/server --filter=@zenorm/db --filter=@zenorm/web
          # prettier's cache keeps each file's content hash, so it checks only files that changed.
          - name: lint (the rest) and format
            key: lint-2
            run: >-
              pnpm exec turbo run lint --filter=!@zenorm/core --filter=!@zenorm/server --filter=!@zenorm/db --filter=!@zenorm/web
              && pnpm exec prettier --check . --cache --cache-strategy content
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: ${{ !startsWith(github.ref, 'refs/tags/') && matrix.key || '' }}
      - run: ${{ matrix.run }}
      - name: Prune turbo cache entries older than a week
        run: find .turbo/cache -type f -mtime +7 -delete 2>/dev/null || true

  # The tests, split across runners: each has 4 vCPUs, and the suites are bound by them (git and
  # stand-in processes). core and server are the two big suites; vitest shards core by file.
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core 1/3
            key: core-1
            args: --filter=@zenorm/core -- --shard=1/3
          - name: core 2/3
            key: core-2
            args: --filter=@zenorm/core -- --shard=2/3
          - name: core 3/3
            key: core-3
            args: --filter=@zenorm/core -- --shard=3/3
          - name: server
            key: server
            args: --filter=@zenorm/server
          - name: the rest
            key: rest
            args: --filter=!@zenorm/core --filter=!@zenorm/server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: ${{ !startsWith(github.ref, 'refs/tags/') && format('test-{0}', matrix.key) || '' }}
      - run: pnpm exec turbo run test ${{ matrix.args }}
      - name: Prune turbo cache entries older than a week
        run: find .turbo/cache -type f -mtime +7 -delete 2>/dev/null || true

  # The required status check: passes only when every job above passed.
  check:
    needs: [static, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "static: ${{ needs.static.result }}, test: ${{ needs.test.result }}" >&2
          exit 1

  smoke:
    # The install smoke test: the packed @ze-norm/cli installed with npm into an empty
    # folder outside the repository, with better-sqlite3's prebuild.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: ${{ !startsWith(github.ref, 'refs/tags/') && 'smoke' || '' }}
      - run: pnpm exec turbo run pack --filter=@ze-norm/cli
      - run: pnpm --filter @ze-norm/cli smoke
