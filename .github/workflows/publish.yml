name: publish

# Releases go only through here, on a version tag: never on a branch push or pull request.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The check and the install smoke test, on Linux; publishing needs both.
  check:
    uses: ./.github/workflows/check.yml

  # Packs the tarball. This job installs and runs the workspace's dependencies, so it gets no
  # publishing identity.
  pack:
    needs: [check]
    runs-on: ubuntu-latest
    outputs:
      node-version: ${{ steps.node.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - id: node
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      # The tag names the version it publishes: v<version> of apps/cli/package.json.
      - name: Check the tag against the package version
        run: |
          version="$(node -p 'require("./apps/cli/package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match @ze-norm/cli version $version (expected v$version)" >&2
            exit 1
          fi
      # Packs again here, from the same commit the check and smoke jobs tested.
      - run: pnpm exec turbo run pack --filter=@ze-norm/cli
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-tarball
          path: apps/cli/pack/*.tgz
          if-no-files-found: error

  # Publishes the packed tarball and nothing else: no checkout, no install, no workspace code.
  publish:
    needs: [pack]
    runs-on: ubuntu-latest
    permissions:
      # npm trusted publishing: npm takes this run's OIDC identity in place of a token,
      # and signs the package's provenance with it.
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ needs.pack.outputs.node-version }}
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-tarball
      - run: npm publish ./*.tgz --provenance --access public
