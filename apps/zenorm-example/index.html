<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>ZeNorm</title>
    <script>
      // The stored colour scheme, or the system's, on the first paint; web's `src/lib/theme.ts`
      // takes over once the app mounts. The same script is in packages/web/index.html.
      (function () {
        var stored = localStorage.getItem("zenorm.theme");
        var dark =
          stored === "dark" ||
          (stored !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web.tsx"></script>
  </body>
</html>
